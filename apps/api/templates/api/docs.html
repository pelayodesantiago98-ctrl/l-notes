{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API de L-notes · Documentación</title>
<link rel="icon" href="/static/favicon.ico?v={{ ASSET_VERSION }}" type="image/x-icon">
{# Swagger UI autoalojado: sin CDN, la página funciona igual sin salida a internet. #}
<link rel="stylesheet" href="{% static 'vendor/swagger/swagger-ui.css' %}">
<style>
  :root{ --ln-bg:#0a0a0f; --ln-bg2:#181818; --ln-border:#2a2a2a; --ln-text:#e6e6e6; --ln-cyan:#06b6d4; }
  body{ margin:0; background:var(--ln-bg); }
  .ln-topbar{
    display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
    padding:.8rem 1.1rem; background:var(--ln-bg2);
    border-bottom:1px solid var(--ln-border); font:600 .92rem/1.2 system-ui,sans-serif;
    color:var(--ln-text);
  }
  .ln-topbar a{ color:var(--ln-text); text-decoration:none; display:flex; align-items:center; gap:.45rem; }
  .ln-topbar a:hover{ color:var(--ln-cyan); }
  .ln-topbar svg{ width:18px; height:18px; }
  .ln-brand{ font-weight:800; letter-spacing:.01em; }
  .ln-spacer{ flex:1; }
  .ln-pill{
    background:rgba(6,182,212,.12); border:1px solid var(--ln-cyan); color:var(--ln-cyan);
    border-radius:999px; padding:.25rem .7rem; font-size:.78rem; font-weight:700;
  }
  /* Swagger UI trae su propio tema claro; lo dejamos así (es el que mejor lee
     en pantallas grandes) y sólo enmarcamos la página con la identidad de L-notes. */
  #swagger-ui{ background:#fff; }
  .swagger-ui .topbar{ display:none; }
  .swagger-ui .info{ margin:2rem 0 1.5rem; }
</style>
</head>
<body>
<div class="ln-topbar">
  <a href="/" class="ln-brand">
    <img src="/static/icons/icon-192.png?v={{ ASSET_VERSION }}" alt="" width="22" height="22">
    <span>L-notes</span>
  </a>
  <span class="ln-pill">API v1</span>
  <div class="ln-spacer"></div>
  <a href="/api/v1/openapi.json" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 18H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    <span>openapi.json</span>
  </a>
  <a href="/">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    <span>Volver a la bóveda</span>
  </a>
</div>
<div id="swagger-ui"></div>
<script src="{% static 'vendor/swagger/swagger-ui-bundle.js' %}"></script>
<script>
window.ui = SwaggerUIBundle({
  url: '/api/v1/openapi.json',
  dom_id: '#swagger-ui',
  deepLinking: true,
  displayRequestDuration: true,
  defaultModelsExpandDepth: 0,
  docExpansion: 'list',
  tryItOutEnabled: true,
  persistAuthorization: true,
  presets: [SwaggerUIBundle.presets.apis],
  /* `curl` de ejemplo con el host real, para copiar y pegar. */
  requestSnippetsEnabled: true,
});
</script>
</body>
</html>
